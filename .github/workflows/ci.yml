name: "CI"
on:
    pull_request:
        branches:
            - main
            - dev
    push:
        branches:
            - main
            - dev

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
              with:
                  ref: ${{ github.head_ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
            - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
              with:
                  node-version: lts/*
            - name: Setup project
              run: |
                  npm install --ignore-scripts
                  npm run package
            - name: Check lint
              run: |
                  npm run lint

    semver-title:
        runs-on: ubuntu-latest
        if: (github.event_name == 'pull_request')
        permissions:
            pull-requests: write
        steps:
            - uses: amannn/action-semantic-pull-request@db6e259b93f286e3416eef27aaae88935d16cf2e # v3.4.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    unit-test:
        runs-on: windows-latest
        permissions:
            pull-requests: write
        steps:
            - name: checkout PR
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
            - name: Merge Branches
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  git config --global user.email "bot@user.noreply.github.com"
                  git config --global user.name "bot"

                  git remote add ${{ github.event.pull_request.base.repo.owner.login }} ${{ github.event.pull_request.base.repo.clone_url }}
                  git fetch ${{ github.event.pull_request.base.repo.owner.login }}
                  git merge ${{ github.event.pull_request.base.repo.owner.login }}/${{ github.event.pull_request.base.ref }}
            - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
              with:
                  node-version: lts/*
            - name: run test
              run: |
                  npm install --ignore-scripts
                  npm run test

            - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
              with:
                  token: ${{ secrets.CODE_COV }}
                  fail_ci_if_error: true
                  verbose: true
