name: "CI"
on:
    pull_request:
        branches:
            - main
            - dev
    push:
        branches:
            - main
            - dev

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.head_ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
            - name: Setup project
              run: |
                  npm install --ignore-scripts
                  npm run package
            - name: Check lint
              run: |
                  npm run lint

    semver-title:
        runs-on: ubuntu-latest
        if: (github.event_name == 'pull_request')
        permissions:
            pull-requests: write
        steps:
            - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    unit-test:
        runs-on: windows-latest
        permissions:
            pull-requests: write
        steps:
            - name: checkout PR
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
            - name: Merge Branches
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  git config --global user.email "bot@user.noreply.github.com"
                  git config --global user.name "bot"

                  git remote add ${{ github.event.pull_request.base.repo.owner.login }} ${{ github.event.pull_request.base.repo.clone_url }}
                  git fetch ${{ github.event.pull_request.base.repo.owner.login }}
                  git merge ${{ github.event.pull_request.base.repo.owner.login }}/${{ github.event.pull_request.base.ref }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
            - name: run test
              run: |
                  npm install --ignore-scripts
                  npm run test

            - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODE_COV }}
                  fail_ci_if_error: true
                  verbose: true
